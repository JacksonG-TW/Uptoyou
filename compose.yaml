# Up to you — the whole stack, brought up by `docker compose up` from this directory.
#
# This file sits at the top of app/ because app/ is extracted into a public repository of
# its own after every merge (D47), and that repository's root is this directory. Nothing
# here may reference a path above app/ — tools/app_boundary_check.py refuses a commit that
# does, and tools/split_boot_check.sh extracts and boots it to prove the rest.
#
# Airflow is deliberately absent. It arrives with the first pipeline DAG rather than with
# the skeleton, because an orchestrator with nothing to orchestrate is 3 GB of idle
# service on a small machine. (**That sentence said «7.5 GB machine» until 2026-08-19**, when
# `free -m` read 15,732 MB total on this box — 4 cores. The argument is unchanged and the number
# was stale, so it is gone rather than corrected: a figure nobody re-measures is a figure that
# will be wrong again.)

name: upto

# **A11 ③ — every service's log is capped, owner-ruled 2026-08-19.** An uncapped `json-file` driver
# grows without bound: the classifier prints a timing line per 25-row batch and a full township is
# ~215 of them, the hourly weather ingest prints a verdict every hour, and nothing rotates any of it.
# The first symptom of that is not a large file, it is a stack that stops.
#
# **10 MB x 3 per service, so 30 MB each and 240 MB across the eight.** Chosen to be larger than one
# long pass's output (信義's 217 batch lines are well under a megabyte) so a single run is never
# truncated mid-flight — the columns from a pass are not reconstructable afterwards, which 信義 proved
# by losing them — and small enough that eight services cannot fill a disk between two people looking.
#
# **A YAML anchor rather than eight copies**, because eight copies of a policy drift and the drift is
# invisible: a service quietly missing its cap looks exactly like one that has it until the day it is
# the one that filled the disk.
# **A21 (owner 「開票」, after the Zeabur audit): Airflow's own configuration, and nothing a DAG
# reads through a Connection.** Every one of the four Airflow services needs these ten; only
# `airflow-init` needs the eleven below it, because init is what writes them into Connections (D33)
# and then exits. A long-lived scheduler that holds the CWA key has it for the length of its
# uptime and uses it never — the DAG asks `BaseHook`, and the key comes back decrypted from the
# metadata database with the Fernet key that IS here.
x-airflow-env: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_HTTP_PORT:-8081}
      # Airflow 3 runs tasks through the Execution API rather than in-process, so a worker
      # has to reach the api-server *over the compose network*. Left at the default it
      # derives from API__BASE_URL above, which says localhost — correct for a browser on
      # the host and refused inside every container. The symptom is a task that queues,
      # fails with no log at all, and a scheduler saying "not found in serialized_dag
      # table", none of which names the URL.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
      # Shared across every Airflow container. Unset, each one generates its own and a task
      # dies with "Invalid auth token: Signature verification failed" — which reads like a
      # credential problem in the DAG and is a configuration problem in the stack.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      # One api-server worker rather than Airflow's default four, and **the number is not a
      # capacity choice — it is which uvicorn code path runs.** `uvicorn/main.py` reads
      # `elif config.workers > 1: Multiprocess(...).run()` / `else: server.run()`. Above one,
      # a supervisor appears; at one, the server runs in-process and there is no supervisor
      # to go wrong. Airflow reaches it through plain `uvicorn.run(workers=...)`, so this env
      # var is the whole lever.
      #
      # **What goes wrong above one, read out of the installed source rather than guessed.**
      # `Process.is_alive(timeout=5)` pings each child and `keep_subprocess_alive` kills any
      # child that does not answer within five seconds — a default in uvicorn 0.34.3's own
      # signature, which Airflow never overrides and no Airflow setting reaches. Children are
      # `spawn`ed (`_subprocess.py`: `get_context("spawn")`), so a child must re-import
      # Airflow from scratch, and `subprocess_started` starts the thread that answers the
      # ping only *after* that import. **A worker therefore cannot answer during the one
      # phase that takes longer than the timeout.** An Airflow import costs 8s warm and idle
      # here and 31-45s cold and contended — always more than 5s once the machine is busy —
      # so the child is killed mid-import and replaced by another cold import, which is
      # slower again.
      # Measured, and the spacing is the signature: kills exactly 5.0s apart, continuously.
      # On the CI runner, PIDs 398 through 600 and not one "Started server process" in 11
      # minutes. A local run under 2x CPU oversubscription reproduced it at 60 kills in 7
      # minutes. Warm and idle it converges on the sixth attempt after 32s, which is why
      # this has never been seen on a warm laptop.
      #
      # **Rejected: two workers, and it was rejected by measurement rather than by argument.**
      # Halving the herd was tried first, on the theory that four cold imports on four cores
      # was the pressure. It failed the same local run in the same way: two is still above
      # one, so the supervisor still exists, and a worker that cannot answer in 5s is killed
      # whether it has one sibling or three.
      # Cost admitted: the orchestrator UI and the Execution API are served by one process,
      # so a slow request delays the next. That is the same trade the product api makes above
      # for a different reason, and the load is one operator plus two hourly tasks.
      AIRFLOW__API__WORKERS: "1"
      # Where the simple auth manager keeps the admin password. Left at its default this is a
      # file inside the api-server's own container filesystem, which means a password nobody
      # chose and a different one after every `down`. Pointing it at a named volume lets
      # airflow-init write the password from .env once and the api-server read it thereafter.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      # **A22 — configuration, not a credential, which is why it is on this side of A21's line.**
      # A bucket name identifies a destination and unlocks nothing; the IAM key that can write to
      # it is a Connection (`upto_backup_s3`), created once by init. **Empty is the default and it
      # is load-bearing**: the backup DAG's first task raises `AirflowSkipException` on an empty
      # bucket, so a fresh clone, `split_boot_check.sh` and CI all boot with the DAG present and
      # skipping rather than absent or red.
      UPTO_BACKUP_S3_BUCKET: ${UPTO_BACKUP_S3_BUCKET:-}
      UPTO_BACKUP_S3_PREFIX: ${UPTO_BACKUP_S3_PREFIX:-db}

# **What only `airflow-init` needs.** These are the values it writes into Connections and into the
# simple-auth passwords file, one time, before it exits. Held by a service that lives for seconds
# instead of by three that live for as long as the stack.
x-airflow-bootstrap-env: &airflow-bootstrap-env
      # The bootstrap layer, and D33 says this is the whole of it. Everything a *task* uses
      # arrives as a Connection instead; these three exist only to stand Airflow up.
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UPTO_CWA_API_KEY: ${UPTO_CWA_API_KEY}
      # A15 / D115 — read by `init.sh` to create the four roles and the two new Connections, and by
      # nothing else. A task reads its database credential from its **Connection** (D33), never from
      # here; these are the bootstrap layer that puts the credential into the Connection once.
      UPTO_API_DB_PASSWORD: ${UPTO_API_DB_PASSWORD}
      UPTO_INGEST_DB_PASSWORD: ${UPTO_INGEST_DB_PASSWORD}
      UPTO_LINEAGE_DB_PASSWORD: ${UPTO_LINEAGE_DB_PASSWORD}
      UPTO_ERASURE_DB_PASSWORD: ${UPTO_ERASURE_DB_PASSWORD}
      # A22's read-only backup role, and the scoped IAM key its dump is uploaded with. Both are
      # read by `init.sh` once, to create `upto_backup_postgres` and `upto_backup_s3`; no task
      # reads either from the environment (D33). `:-` on the AWS pair because absent is legal —
      # a stack with no AWS account creates no Connection and the DAG skips (A22).
      UPTO_BACKUP_DB_PASSWORD: ${UPTO_BACKUP_DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # A10's alert channel. Read by `init.sh` once, to create the `telegram_alerts` Connection;
      # no task reads them afterwards (D33). `:-` because absent is legal — a stack with no bot
      # runs with alerting off rather than refusing to start.
      UPTO_TELEGRAM_BOT_TOKEN: ${UPTO_TELEGRAM_BOT_TOKEN:-}
      UPTO_TELEGRAM_CHAT_ID: ${UPTO_TELEGRAM_CHAT_ID:-}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# **A11 ① — two networks, so the front door cannot reach the database. Owner-ruled 2026-08-19.**
#
# Until now every service shared one default network, which means `nginx` could open a socket to
# PostgreSQL. Nothing in the product wants that: the proxy serves files and forwards `/api/` to the
# api container, and the database is two hops from anything a request touches. One network made the
# blast radius of a compromised nginx the whole stack; two make it the api's HTTP surface, which is
# the surface it is supposed to be able to reach.
#
# **`proxy` is on `edge` only, and that is the whole assertion.** Docker's embedded DNS resolves a
# service name only across a *shared* network, so from `proxy` the name `db` does not resolve at all
# — it fails at DNS rather than at connect, which is the earlier and clearer failure. `api` is on
# both because it is the one service that legitimately spans them.
#
# **`data` is deliberately NOT `internal: true`, and that is a trade rather than an omission.** An
# internal network has no route off the host, and the ingests are 17 MB and 66 MB downloads run from
# `airflow-scheduler`, while the classifier in `api` reaches the GPU relay at `172.17.0.1`. An
# internal `data` would break both. **Rejected: a third `egress` network** to give those two outbound
# reach while keeping `data` internal — it buys nothing here, because the thing being kept away from
# the database is `proxy`, and `proxy` is already not on `data`.
#
# **The gateway address changes and the relay's does not.** Each user-defined network gets its own
# subnet, so a container's default gateway is no longer `172.17.0.1` — but `172.17.0.1` is `docker0`
# on the *host*, which is what `tools/tunnel_relay.py` binds, and a container reaches it as an
# ordinary host address rather than as its gateway. Verified from inside `upto-api-1` after this
# split, 2026-08-19; if it ever stops answering, read `CLAUDE.md`'s relay paragraph before assuming
# this block caused it.
networks:
  edge:
    driver: bridge
  data:
    driver: bridge

# **A11 ② — every service has a memory ceiling and a CPU ceiling, measured. Owner-ruled 2026-08-19.**
#
# **Where the numbers come from:** `python3 probes/a11_container_footprint.py`, which reads each
# container's `/sys/fs/cgroup/memory.peak` — the kernel's own high-water mark — rather than polling
# `docker stats`. A limit has to cover the worst *moment*, and the tax source's parse peak lasts
# seconds inside a 19-second task, so a 5-second poller has a real chance of never seeing the top.
# One read reports the true maximum with no sampler in the measurement (H41 from the other side).
#
# **The window the numbers were taken over, 2026-08-19:** a fresh `--force-recreate` boot, then two
# real DAG ingests, then the tax source's full 1,711,395-row parse under `--force-parse`, then the
# five-agent walkthrough, then M1's idempotency suite (five sources through their real CLIs). Both
# ends read with the same probe.
#
# **`ollama` was up the whole time and I wrote that it was not. Corrected 2026-08-19, same day.** It
# is profile-gated (D63), but a `--profile model` container from an earlier session had been running
# four days — so it was never restarted into the window, and the probe's service list did not even
# name it. Its `memory.peak` reads **10.79 GB**: larger than everything else in this stack put
# together, on a 15.7 GB box, against 1.37 GB current with no model resident. It still has no ceiling,
# and now for a reason rather than for a wrong fact — **that 10.79 GB is mostly reclaimable page cache
# from reading model weights off disk**, so a `mem_limit` derived from it would bound memory the
# kernel hands back for free, and one set below it could make a model load fail outright. A real
# ceiling here needs a window with a model resident and cache separated from anonymous memory
# (`memory.stat`'s `file` against `anon`), and nobody has taken that measurement. **So the number
# missing from this page is the largest one on it, which is worth a reader knowing.**
#
# **`mem_limit` is 1.5x the measured peak, except where it says otherwise beside the service.** Three
# are set above that line for named reasons; each says which and why. **A ceiling set from a window
# that missed the heavy path is worse than no ceiling** — it turns the first real republication into
# an OOM kill at 03:20 — which is why the window above deliberately contains a forced full parse and
# not just the hash short-circuit the two triggered DAGs actually took.
#
# **`cpus` is NOT 1.5x anything, and the reason is that the measurement cannot support it.** There is
# no `cpu.peak`; `cpu.stat` is cumulative, so the probe reports *mean* cores over the window and a
# burst is invisible in a mean. Measured means were 0.007 (proxy) to 0.482 (airflow-scheduler), while
# a burst already on record is nearly a full core for ~8 s at each of the classifier's 25-row commits
# (2026-08-19, in `CLAUDE.md`). So these are ceilings against a runaway container on a shared 4-core
# box, set far above every mean, and they oversubscribe on purpose: 8.5 across 4 cores, because a
# ceiling is not a reservation and a stack that can only ever use 4 in total would be slower than
# today for no safety gained. **A `cpus` set near the mean would look exactly like the upstream
# Ollama slowdown looked** — everything working, everything slower, nothing saying why.
#
# **No `memswap_limit`.** Setting it equal to `mem_limit` disables swap for the container and turns
# every overshoot into an immediate kill; leaving it lets an overshoot page out and merely crawl,
# which on a development box is the failure mode that can be investigated rather than the one that
# has already happened. The 6.5 GB of swap on this box is the safety margin these ceilings lean on.

services:
  db:
    <<: *logging
    # A11 — peak **335.5** MiB, and the first figure written here was 182.8: **the same probe read
    #     84% higher two hours later**, after the walkthrough and the split-boot gate had run again.
    #     Neither reading was wrong — a high-water mark is a *lower bound on the true peak*, and one
    #     window is not the maximum. 1.5x the new figure is 503m, which the original 512m cleared by
    #     2%; too close to leave, so 768m — 2.3x, which is where the room is.
    #
    #     **The load that produced 335.5 MiB is VERSIONED AND GROWS, so this figure is not a fixed
    #     quantity waiting to be observed — it is a moving one.** `tools/agent_walkthrough.py` drives
    #     five agents through the whole product and **its check list grows with every ruling by
    #     design**: 16 checks at A5's first run, four commits to it on 2026-08-19 alone. Each new
    #     assertion is more requests against this container in one burst. Pointed out by the frontend
    #     session, which commits that script — and it is the half I had not stated.
    #
    #     **So when this number is next re-read, take it DURING or right after a walkthrough run,
    #     never on a quiet stack.** An idle box reads ~200 MiB, and a reader who measures that against
    #     a 768m ceiling concludes it is three times too generous and shrinks it — which is the same
    #     wrong-window error as the 182.8 above, arrived at from the other direction.
    #
    #     Still in no measured window at all: the integration tests that build and drop their own
    #     databases, and pgvector's kNN over the crib. An OOM-killed backend is the worst failure on
    #     this list, which is why the room stays.
    #
    #     **This ceiling IS being pressed, and it is staying at 768m. Measured 2026-08-20:
    #     `memory.events` reads `max 45, oom_kill 0`** — the cgroup hit its ceiling forty-five times
    #     and the kernel reclaimed every time; nothing has been killed and `RestartCount` is 0. One
    #     five-agent walkthrough run accounts for about **six** of those hits (39 → 45 across a
    #     single run), which is the number the walkthrough-growth arrangement exists to surface.
    #
    #     **Raising it would chase a number that will always be filled.** PostgreSQL grows into
    #     whatever it is given with page cache, most of it reclaimable, so `memory.peak` converges on
    #     `memory.max` under any finite limit and `max` climbing is what a cap *doing its job* looks
    #     like. **The signals to act on are `oom_kill > 0` and a rising `RestartCount`** — both zero.
    #     Backend's call as a tuning number inside the ruled rule; overrule it if a query ever gets
    #     slow in a way this explains.
    #
    #     **And it retired the instrument that set it.** `probes/a11_container_footprint.py` reads
    #     `memory.peak`, which now reports the ceiling rather than the demand — re-running it to check
    #     these limits is circular, and the circularity is invisible in its own output. The probe says
    #     so at the top and prints `memory.events` beside every peak.
    mem_limit: 768m
    cpus: 2.0
    networks:
      - data
    # pgvector's own build of PostgreSQL 17, and it is here for the `vector` extension alone
    # (D88) — same major version, same settings. The collation is C (verified 2026-08-15
    # against pg_database), so the alpine→debian move leaves the existing volume
    # byte-compatible and nothing needs reindexing.
    image: pgvector/pgvector:pg17
    # **A11 ⑥ — five planner and memory settings, owner-ruled 2026-08-20, as `command` flags.**
    #
    # **Flags rather than a `postgresql.conf`, and that is about the public repository.** A conf file
    # needs a bind mount, and a mount is a path that does not travel into the extract
    # `tools/publish_app.sh` produces — so the settings would silently not ship. These do, and they
    # survive `--force-recreate`. The image's CMD is `["postgres"]` under `docker-entrypoint.sh`, so
    # this REPLACES the CMD and has to name `postgres` itself; appending flags alone drops the binary.
    #
    # **`effective_cache_size=576MB` is a CORRECTION, not a tune.** PostgreSQL's default is 4 GB and
    # this container's ceiling is 768m, so the planner has been told there is roughly five times more
    # cache than can ever exist — which biases it toward index scans it cannot keep cached. 576MB is
    # three quarters of the real ceiling and the first time the number has been true. First ruled at
    # 384MB against a 512m limit that had already been raised; re-ruled the same day once the live
    # ceiling was read rather than remembered.
    #
    # **`work_mem=16MB` is the one with a cost: it is per sort or hash node PER CONNECTION**, so
    # 4 MB → 16 MB multiplies by concurrency, not by one. **Measured with `memory.events` (`max`,
    # `oom_kill`) and `RestartCount`, never with `memory.peak`** — under a `mem_limit`, peak converges
    # on the limit and reads 768 whatever the demand is, so it cannot answer the question it appears
    # to answer.
    #
    # **The ruling's condition, answered 2026-08-20 over a window containing a full 1,711,583-row tax
    # parse (14.4 s), on a cgroup freshly zeroed by this restart: `max 0` · `oom_kill 0` ·
    # `RestartCount 0` · peak 178.8 MiB · current 170.2 MiB. 768m covers it with large room.**
    #
    # **And that reading retires the alarming one.** Before this restart db's `memory.peak` read
    # **768.0 MiB against its own 768 MiB limit** with `max 45`, which looks like a database at its
    # ceiling. A fresh container doing the single heaviest thing this pipeline asks of it peaks at
    # **179 MiB** — so those 45 events and that 768 were hours of accumulated reclaimable page cache
    # pressing the cap, exactly as the cap is for, and not demand. The number that looked like a
    # warning was the ceiling describing itself.
    #
    # **`log_min_duration_statement=500ms` writes to the log**, which A11 ③ caps at 10m × 3 per
    # service; a slow-query line is a few hundred bytes and the cap holds.
    #
    # **The spill measurement, and it does NOT show what the change was hoped to show.** Baseline read
    # 05:38Z before any of this landed and deliberately not reset, because resetting discards the only
    # history there is: `pg_stat_database` for `upto` read **23 temp_files / 79 MB** lifetime.
    # **After the full parse it reads 23 / 79 MB — identical.** So that workload spilled nothing
    # either way, and `work_mem=16MB` is **unmeasured for the tax parse rather than shown to help it**.
    # The 23 lifetime spills came from something else — the pgvector neighbour queries and the
    # integration tests that build their own databases are the candidates, and neither ran in this
    # window. Saying "spills unchanged, therefore fine" would be the mistake; the honest reading is
    # that the before/after was taken over a workload that does not exercise the setting.
    #
    # **`log_min_duration_statement` was proven working rather than inferred from silence.** The parse
    # logged nothing, which alone cannot distinguish *nothing was slow* from *logging is broken*; a
    # deliberate `select pg_sleep(0.7)` logged `duration: 702.780 ms`. So the parse's silence means no
    # statement in it exceeded 500 ms.
    command:
      - postgres
      - -c
      - effective_cache_size=576MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=16MB
      - -c
      - log_min_duration_statement=500ms
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation, so ordering does not depend on the host's locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      # Read only by db/init/02-airflow.sh, once, on an empty volume.
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # A named volume rather than a bind mount, on purpose: SELinux is Enforcing on the
      # development machine and a bind mount would need a :z label to be readable at all,
      # which fails as a bare permission error naming neither SELinux nor the mount.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The API must not start before the database is ready (H6). pg_isready with the
      # real user and database, not a bare port check — the port opens before initdb has
      # finished, which is exactly the window that produces a flaky first boot.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # A15 / D115 — the one-shot bootstrap: migrations and the township seed, as the owner.
  #
  # **This exists so `docker compose up` stays sufficient (§6) while the serving container stops
  # holding the owner's credential.** `alembic` does DDL and the seed writes a reference table;
  # `upto_api` can do neither, by design. `api` waits on this with `service_completed_successfully`,
  # the same shape `airflow-scheduler` already uses for `airflow-init`, so a failed migration means
  # the API never starts — the guarantee the old in-container entrypoint gave, one container
  # earlier.
  #
  # It runs and exits. `restart: "no"` is explicit because the default would restart a completed
  # one-shot for ever.
  migrate:
    <<: *logging
    restart: "no"
    networks:
      - data
    build:
      context: ./api
    environment:
      UPTO_BOOTSTRAP: "1"
      UPTO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The five login roles are created here, by the owner, immediately before the migration that
      # grants to them — see `upto/roles.py`. These are read for that and for nothing else.
      UPTO_API_DB_PASSWORD: ${UPTO_API_DB_PASSWORD}
      UPTO_INGEST_DB_PASSWORD: ${UPTO_INGEST_DB_PASSWORD}
      UPTO_LINEAGE_DB_PASSWORD: ${UPTO_LINEAGE_DB_PASSWORD}
      UPTO_ERASURE_DB_PASSWORD: ${UPTO_ERASURE_DB_PASSWORD}
      # A22's read-only backup role (revision 0038 grants it `pg_read_all_data`). Created here for
      # the same reason as the other four: `ensure()` is the one place a role is created, and it
      # runs in the one-shot service that exits.
      UPTO_BACKUP_DB_PASSWORD: ${UPTO_BACKUP_DB_PASSWORD}
      # The seed writes `township_station`, which is the pipeline's table — so it uses the
      # pipeline's role rather than the owner's, even here.
      UPTO_INGEST_DATABASE_URL: postgresql+asyncpg://upto_ingest:${UPTO_INGEST_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["true"]
    depends_on:
      db:
        condition: service_healthy

  # A15 / D115 — the build-and-drop tests, and the only place the OWNER's credential lives.
  #
  # **Why a whole service for it.** Every integration test does `create database …`, which
  # `upto_api` cannot do. Putting the owner's URL back into the `api` container would have kept the
  # tests running and made the boundary theatre: a shell there could `psql` as the superuser, and
  # 「`TRUNCATE preference` is refused」 would be true only because psql had been handed the narrow
  # URL. This service is what makes that Done line mean what it says — **the api container holds no
  # owner credential at all**.
  #
  # **`profiles: ["test"]` keeps it out of `docker compose up`.** It is never started with the
  # stack, never listens, and has no healthcheck; it exists to be `run --rm`. Same image as `api`,
  # so it is the same code — a test image that could drift from the served one would be worse than
  # no isolation.
  #
  #     docker compose run --rm tests python /srv/tests/test_role_grants.py
  #
  # It joins `data` only: a test has no business on the edge network.
  tests:
    <<: *logging
    profiles: ["test"]
    networks:
      - data
    build:
      context: ./api
    environment:
      # The owner. Alembic and `create database` need it; nothing served does.
      UPTO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *logging
    # A11 — peak 143.3 MiB, reached by M1's five real ingests. **1.5x is 215m; 512m on purpose** — the
    #     classifier and the evaluation rounds run here and their memory was NOT measured (only their
    #     CPU: ~0.24% of a core, bursting to nearly one at each 25-row commit), so this is the one
    #     ceiling standing over an unmeasured workload.
    mem_limit: 512m
    cpus: 2.0
    networks:
      - edge
      - data
    build:
      context: ./api
    environment:
      # Async driver end to end (H1): a synchronous driver blocks the event loop, and
      # while it is blocked nobody is served — not the other four people in the room,
      # not the open SSE streams, not the health check.
      # A15 / D115 — three URLs in one container, because this container is the entry point for
      # three different things. `UPTO_DATABASE_URL` keeps its name and is the **server's** alone,
      # so `upto.db.database_url()` is untouched; the pipeline CLIs and the lineage tool each read
      # their own below and pick it up through `pipeline_session_factory` / `lineage_session_factory`.
      #
      # **`POSTGRES_USER` is no longer here and that is the ruling.** It is the owner — Alembic, the
      # build-and-drop tests, an operator's psql — and no service connects as it. A shell in this
      # container can no longer `TRUNCATE preference`.
      #
      # A psql-usable DSN is derived, never stored twice: `psql "${UPTO_DATABASE_URL/+asyncpg/}"`.
      UPTO_DATABASE_URL: postgresql+asyncpg://upto_api:${UPTO_API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      UPTO_INGEST_DATABASE_URL: postgresql+asyncpg://upto_ingest:${UPTO_INGEST_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      UPTO_LINEAGE_DATABASE_URL: postgresql+asyncpg://upto_lineage:${UPTO_LINEAGE_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # A20/D74: the origin `python -m upto.issue` builds its invite link on. Passed through empty
      # when unset — `upto/issue.py` holds the default, so an operator in a fresh clone still gets
      # a link that works, and a real deployment sets one name.
      UPTO_PUBLIC_ORIGIN: ${UPTO_PUBLIC_ORIGIN:-}
    # Exactly one worker, and the reason lives here rather than in a comment somewhere
    # else (H2): live room state is per-process, and a second worker means two people in
    # the same room can be served different rooms. The no-cache rule forbids the usual
    # escape hatch of an external pub/sub layer, so the limit is argued, not solved.
    command: ["uvicorn", "upto.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
      # A15: the schema is somebody else's job now, and the API waits for it rather than doing it.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  proxy:
    <<: *logging
    # A11 — peak 15.7 MiB. **1.5x is 24m, which is under what nginx needs to start at all**, so 64m is a
    #     floor rather than a calculation.
    mem_limit: 64m
    cpus: 0.5
    networks:
      - edge
    build:
      # app/ rather than ./proxy: the image carries the nginx config and the static front
      # end, and those are siblings. Both paths stay inside app/, which is what H18 asks.
      context: ./
      dockerfile: proxy/Dockerfile
    ports:
      # The only published port. Everything else talks over the compose network, so the
      # database is not reachable from the host at all.
      #
      # **The container side is 8080 since A11 ⑤, and the published side is unchanged.**
      # `nginxinc/nginx-unprivileged` runs its master as uid 101 and cannot bind 80, so
      # `upto.conf` listens on 8080 (frontend's 7a0b576) — `localhost:8080` and
      # `UPTO_HTTP_PORT` mean exactly what they meant before.
      - "${UPTO_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # **The port is written out, and leaving it implicit was a real bug caught by review.**
      # A bare `http://127.0.0.1/health` resolves to port 80, so after the move to 8080 this
      # healthcheck fails against a proxy that is serving perfectly — and the failure reads as
      # "the proxy is not answering", which is the same misdirection the `listen` comment in
      # `upto.conf` is about, one layer out. Found by the frontend session, 2026-08-19.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---- Airflow, MVP item 12: self-hosted, in this same stack -------------------------
  #
  # LocalExecutor and nothing distributed. The machine has 7.5 GB and also runs the
  # development work; a Celery or Kubernetes executor would buy parallelism this pipeline
  # has no use for — two hourly tasks — at the price of a broker and more services.
  #
  # Airflow's metadata lives in the same PostgreSQL instance, in its own database owned by
  # its own role. A second Postgres container would isolate nothing that matters here.

  airflow-init:
    <<: *logging
    # A11 — one-shot: `db migrate` plus four `connections add`. **Not separately measured** — it exits
    #     before any window can contain it — so it borrows the api's ceiling rather than claiming one
    #     of its own.
    mem_limit: 512m
    cpus: 2.0
    networks:
      - data
    build:
      context: ./
      dockerfile: airflow/Dockerfile
    entrypoint: ["/bin/bash", "/opt/airflow/init.sh"]
    volumes:
      - ./airflow/init.sh:/opt/airflow/init.sh:ro,z
      - airflow-auth:/opt/airflow/auth
    environment:
      <<: [*airflow-env, *airflow-bootstrap-env]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  airflow-scheduler:
    <<: *logging
    # A11 — peak 664.7 MiB, the highest in the stack, and it is the highest because the ingests run as
    #     its subprocesses: the tax source's 1.7M-row parse is **this** container's memory, not the
    #     api's. 1.5x is 997m.
    mem_limit: 1024m
    cpus: 2.0
    networks:
      - data
    build:
      context: ./
      dockerfile: airflow/Dockerfile
    command: ["scheduler"]
    environment: *airflow-env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      # These five numbers are one budget, and they are the same on all three Airflow
      # components. The reasoning lives here only; the other two carry a pointer and state
      # what differs, because three copies of this drifted once already.
      #
      # **What the old numbers cost: a red CI run, and the check was never wrong.** The
      # split-boot job failed on the runner while the scheduler's own log looked perfect —
      # "Starting the scheduler", gunicorn listening, the orphaned-task loop ticking every
      # five minutes. What failed was this healthcheck's clock, twice over.
      #
      # **`airflow jobs check` is a full Airflow CLI cold start, and it costs 8 seconds warm
      # and 31 cold.** Measured off Docker's own health log on this 4-core machine, warm and
      # idle: 7.98 / 7.99 / 8.17 / 8.68 / 8.73s, against a 10s timeout. With the host merely
      # 2x oversubscribed it goes 9.26 / 11.43 / 9.00s, and at 4x 12.24 / 9.74 / 11.41s —
      # over the timeout at the first step of load. **Then measured where it actually matters,
      # on a container this check had just built, cold, with the host 2x oversubscribed: the
      # first probe ran 45.26s and was killed, and the first probe that *succeeded* took
      # 30.87s.** Three times the old allowance, and the reason 45s is not the number either:
      # the ceiling was reached on the first try.
      # **Exit code 0 every time it was allowed to finish.** The command answers "Found one
      # alive job" and is killed for being slow, so the neighbouring theory — that the check
      # honestly returned non-zero for a while — is not what happened.
      # Confirmed by arithmetic against the runner's own timestamps: 687s from container
      # start to "is unhealthy" equals 180 + 20 x (10 timeout + 15 interval). A probe that
      # failed fast would have taken 480s. Every one of the 20 probes burned its full
      # timeout.
      #
      # **And 180s expired before the thing it asks about existed.** On the runner the
      # container started at 02:08:08 and the scheduler printed "Starting the scheduler" at
      # 02:12:02 — 234s. The allowance ran out 54s early, so the first counted failures were
      # guaranteed rather than informative. 360s covers the measured cold start with margin.
      #
      # **`start_interval` is the one that stops this check from causing what it reports.**
      # Docker's default is 5s, so during the start period two containers each ran a probe
      # this expensive every 13s — most of a core spent proving that a starting service had
      # not started, exactly while it was trying to start. At 45s it is under half that.
      #
      # Cost admitted: a scheduler that dies is now called unhealthy after up to
      # 360 + 3 x (90 + 20) = 690s instead of 480s. That buys nothing back, because nothing
      # acts on this status — `restart: unless-stopped` does not restart on unhealthy, no
      # service depends on it, and the only readers are `up --wait` and a human at
      # `compose ps`.
      # **Which is why retries came down from 20 to 3 while everything else went up.** All 20
      # were ever worth was 300 more seconds of the same failure; one probe allowed to finish
      # is the whole requirement. And 690s has to stay under split_boot_check.sh's
      # `--wait-timeout 900`, measured from `up` rather than from these containers — the
      # failed run spent 73s pulling and migrating before Airflow started, so the real
      # comparison is 73 + 690 against 900. At retries 20 that sum was 823s and the margin
      # was 77s; a slower pull would have turned a named unhealthy container into a bare
      # compose timeout that names nobody.
      # Rejected: keeping 10s and asserting something cheaper instead — reading the
      # scheduler's heartbeat out of the metadata database, or trusting airflow-api's
      # /monitor/health, which reports every component centrally. Both are faster and both
      # change what is asserted: this container would stop vouching for itself. Not a
      # timeout's decision to make.
      interval: 20s
      timeout: 90s
      retries: 3
      start_period: 360s
      start_interval: 45s
    restart: unless-stopped

  # Airflow 3 splits DAG parsing out of the scheduler into its own component, and it is not
  # optional: without it the scheduler runs, reports healthy, and finds no DAGs at all —
  # `dags list` is empty and `list-import-errors` is empty too, which reads like a parsing
  # bug rather than a missing process.
  airflow-dag-processor:
    <<: *logging
    # A11 — peak 429.8 MiB, all of it DAG parsing — it did not move at all under load, which is what
    #     parsing-only should look like. 1.5x is 645m.
    #
    #     **`cpus` was 1.0 and it throttled. Raised to 2.0 on 2026-08-19, the same day it was set.**
    #     Measured from this container's own `cpu.stat`: 982 throttled periods of 6,904 — **14.2%**,
    #     58.6 s of stall — while every other service in the stack read 0.0–0.5%. Found by the
    #     evaluator, who reported 13.8%; it had grown to 14.2% by the time I confirmed it, which is
    #     itself the point.
    #
    #     **This is exactly the failure the A11 ② block warned about in the abstract:** a ceiling set
    #     near a *mean* clips the bursts, and DAG parsing is nothing but bursts — eight DAG files
    #     re-parsed on a timer. A throttled container does not log, does not fail a healthcheck, and
    #     does not appear in `docker stats` as anything but slower. The mean that justified 1.0 was
    #     0.355 cores, and it was true.
    #
    #     **After the raise, measured again: 25 throttled periods of 745 — 3.4%.** Better by four
    #     times and **not zero**, which is worth stating rather than rounding away: 2.0 is already
    #     half of this 4-core box for one service that only parses files, so the remaining clipping
    #     at the very peaks is accepted rather than unnoticed. If it ever matters, the instrument is
    #     `docker compose exec airflow-dag-processor cat /sys/fs/cgroup/cpu.stat` and the number to
    #     watch is `nr_throttled` against `nr_periods`.
    mem_limit: 768m
    cpus: 2.0
    networks:
      - data
    build:
      context: ./
      dockerfile: airflow/Dockerfile
    command: ["dag-processor"]
    environment:
      <<: *airflow-env
      # **300, not Airflow's inherited default of 30 — and it did NOT fix what it was set for.**
      #
      # **The measurement, kept because the negative result is the useful part.** This container
      # burst to ~100% of a core for seconds at a time; mean **29.1%** before. After raising the
      # interval ten-fold, steady state (measured from this cgroup's own `usage_usec` over a
      # 55 s window, not by sampling) is **29.9%** — **no change**. The knob the vendor names for
      # this symptom does not control it here.
      #
      # **What is established:** our DAG code is not the cost (`airflow dags report`: 0.13 s for
      # all ten files) and the burst tracks the `Sync N DAGs` lines. **What is NOT established is
      # what the sweep consists of, and no second guess is offered** — the first hypothesis
      # (per-file interpreter startup, measured at 7.7–8.8 s for a cold `python <dagfile>`) was
      # disproved: the processor forks from a parent that has already imported Airflow, which is
      # why the report reads 0.13 s. The next step is a profiler inside the container, not
      # another inference.
      #
      # **Kept rather than reverted** so the value is an explicit choice with its result recorded
      # beside it: someone will reach for this knob again, and this comment is the reason not to.
      #
      # The vendor names this exact knob for this exact symptom
      # (https://airflow.apache.org/docs/apache-airflow/stable/configurations-ref.html, read
      # 2026-09-04, Airflow 3.0.2): «The DAG file is parsed every
      # `[dag_processor] min_file_process_interval` number of seconds … **keeping this number low
      # will increase CPU usage**», and «**You can mitigate CPU usage by increasing the
      # `min_file_process_interval`** … changes to such files will be picked up slower».
      #
      # **The stated cost is free here.** A DAG edit is picked up in up to 5 minutes instead of
      # 30 seconds — and nothing relies on that path: H46 already requires an explicit
      # `airflow dags reserialize` after any change under `airflow/dags/`, and H28 a rebuild
      # before it. The pickup we use is the manual one.
      #
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "300"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\" || exit 1"]
      # airflow-scheduler's healthcheck carries the whole budget and why. Identical here,
      # and for the identical reason: this is the same 8-second CLI cold start. Measured on
      # this container, warm and idle: 7.97 / 8.15 / 8.22 / 8.44 / 8.61s.
      interval: 20s
      timeout: 90s
      retries: 3
      start_period: 360s
      start_interval: 45s
    restart: unless-stopped

  airflow-api:
    <<: *logging
    # A11 — peak 275.1 MiB. 1.5x is 413m.
    mem_limit: 512m
    cpus: 1.0
    networks:
      - data
    build:
      context: ./
      dockerfile: airflow/Dockerfile
    command: ["api-server"]
    environment: *airflow-env
    volumes:
      # Writable, and it has to be: the api-server opens this file "a+" on every start and
      # only catches BlockingIOError, so a read-only mount is a PermissionError that stops
      # the container. It leaves an existing admin entry alone, which is what makes
      # airflow-init's write the one that decides the password.
      - airflow-auth:/opt/airflow/auth
    ports:
      # Second published port, and it is the orchestrator's own UI rather than the product.
      #
      # **Bound to loopback by default (2026-09-04), so the SSH tunnel is the only door by
      # CONSTRUCTION rather than by the security group alone.** On a public host this was
      # `0.0.0.0:8081` — unreachable today because the SG allows 80 and 22 and nothing else, and
      # **one SG edit from being the operator's Airflow UI on the open internet.** A defence that
      # depends on a setting in a different system, edited by a different tool, is one mistake
      # deep. The tunnel is in the runbook's §7:
      #     ssh -N -L 8081:127.0.0.1:8081 ec2-user@<host>
      #
      # `AIRFLOW_BIND` exists for the dev VM, which reaches this UI from the LAN; it is set to
      # `0.0.0.0` in that box's `.env` so nothing there changes, and **the DEFAULT is the safe
      # one** — a host that says nothing gets loopback.
      - "${AIRFLOW_BIND:-127.0.0.1}:${AIRFLOW_HTTP_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/monitor/health || exit 1"]
      # airflow-scheduler's healthcheck carries the budget and why. **Two numbers differ, and
      # the difference is the point.** This probe is not a CLI cold start: measured warm off
      # Docker's health log at 0.06 / 0.07 / 0.08 / 0.08 / 0.10s, so 45s would be a timeout
      # for a check that costs a tenth of a second.
      # 15s rather than 5s all the same, because of how this one fails. The uvicorn *parent*
      # owns the listening socket, so while no worker has finished importing the kernel still
      # accepts the connection and nothing ever answers it — curl hangs rather than being
      # refused. That is why this container, not the scheduler, is the one compose named
      # first on the failed run; it was hanging to timeout on every probe for 11 minutes
      # while its workers were killed and respawned. AIRFLOW__API__WORKERS above is that
      # half of the fix.
      # Worst case here: 360 + 3 x (15 + 20) = 465s.
      interval: 20s
      timeout: 15s
      retries: 3
      start_period: 360s
      start_interval: 45s
    restart: unless-stopped

  # D63/D64's model, and it is deliberately not part of `docker compose up`.
  #
  # **Behind a profile, ruled 2026-08-14.** The classification backfill is a batch that runs
  # occasionally over one township (D75) — it does not need a resident service, and the
  # October EC2 instance (D61) has 4 GB, which a 2 GB model would take most of. So the
  # service is declared here, where a reader can see the deployment and reproduce it, and
  # started only when a backfill runs:
  #
  #   docker compose --profile model up -d ollama
  #
  # Measured 2026-08-14 before it was written: the model peaks at 2,124 MB beside the whole
  # running stack, with 2,919 MB available — it fits this machine, which is why it is here
  # rather than on a GPU somewhere (D64's ladder, step 1).
  ollama:
    <<: *logging
    # A11 — **No ceiling, and here it is a gap rather than a decision.** `memory.peak` 10.79 GB
    #     against 1.37 GB current with nothing resident — but that peak is mostly reclaimable page
    #     cache from reading weights, so a limit derived from it would bound what the kernel returns
    #     anyway, and a lower one could make a model load fail. It needs a window with a model
    #     resident and `memory.stat`'s `file` separated from `anon`. Read the A11 ② block above: the
    #     first version of that block said this container was not running, and it had been up four
    #     days.
    #
    #     **Recreated 2026-08-19 for a reason that was not about the ceiling.** The four-day-old
    #     container predated the `edge`/`data` split, so it sat alone on `upto_default` and
    #     `ollama:11434` **did not resolve from `api`** — which `evaluate/run_round.py` uses by
    #     default. Found by the evaluator. `docker compose --profile model up -d --force-recreate
    #     ollama` put it on `data`; verified from inside `upto-api-1`, six models. **A network split
    #     only covers the containers it recreates**, and a long-lived one is exactly the container
    #     nobody rebuilds. Its `memory.peak` is now 26.3 MiB with nothing loaded, so the resident
    #     measurement this service needs is finally takeable from a clean start.
    networks:
      - data
    image: ollama/ollama:0.12.3
    profiles: ["model"]
    environment:
      # Unload after one pass rather than holding 2 GB between nightly runs.
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
  # The pulled weights. A named volume because a 2 GB model must survive a rebuild, and
  # because it is the one thing here that must never reach the image or the repository.
  ollama-models:
  # Only ever holds the admin password file. A named volume rather than a bind mount for the
  # reason db-data gives, and because the password does not belong in the repository.
  airflow-auth:
