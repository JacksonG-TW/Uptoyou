<svg xmlns="http://www.w3.org/2000/svg" width="840" height="690" viewBox="0 0 840 690" font-family="Helvetica Neue, Helvetica, Arial, 'Noto Sans TC', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="840" height="690" fill="#ffffff"/>
<text x="20" y="34" text-anchor="start" font-size="20" font-weight="800" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">How a restaurant gets the name you would recognise</text>
<text x="20" y="60" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Three public sources, one ladder. The highest rung that exists for a site wins:</text>
<text x="20" y="78" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">nothing is invented, and the registered name is always there as the floor.</text>
<rect x="20" y="104" width="270" height="340" rx="10" fill="none" stroke="#0072B2" stroke-width="1.4" stroke-dasharray="7 5"/><text x="30" y="122" text-anchor="start" font-size="13" font-weight="700" fill="#005A8C" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What the city publishes</text>
<rect x="540" y="104" width="280" height="340" rx="10" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-dasharray="7 5"/><text x="550" y="122" text-anchor="start" font-size="13" font-weight="700" fill="#A84A00" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What a person reads, best rung first</text>
<rect x="36" y="136" width="238" height="64" rx="8" fill="#E6F1F8" stroke="#0072B2" stroke-width="1.6"/><text x="155.0" y="165.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">餐飲衛生分級評核</text><text x="155.0" y="183.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">one row per shopfront</text>
<rect x="556" y="136" width="248" height="64" rx="8" fill="#FBEBDF" stroke="#D55E00" stroke-width="1.6"/><text x="680.0" y="165.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the sign</text><text x="680.0" y="183.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">摩斯漢堡-南港環球店</text>
<path d="M274,168 L552,168" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a)"/><text x="413" y="160" text-anchor="middle" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the shop&#x27;s own sign</text>
<rect x="36" y="236" width="238" height="64" rx="8" fill="#E6F1F8" stroke="#0072B2" stroke-width="1.6"/><text x="155.0" y="265.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">臺北市食材登錄平台</text><text x="155.0" y="283.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">brand ↔ company</text>
<rect x="556" y="236" width="248" height="64" rx="8" fill="#FBEBDF" stroke="#D55E00" stroke-width="1.6"/><text x="680.0" y="265.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the brand</text><text x="680.0" y="283.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">摩斯漢堡</text>
<path d="M274,268 L552,268" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a)"/><text x="413" y="260" text-anchor="middle" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the brand behind the company</text>
<rect x="36" y="336" width="238" height="64" rx="8" fill="#E6F1F8" stroke="#0072B2" stroke-width="1.6"/><text x="155.0" y="365.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">食品業者登錄</text><text x="155.0" y="383.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the registered site</text>
<rect x="556" y="336" width="248" height="64" rx="8" fill="#FBEBDF" stroke="#D55E00" stroke-width="1.6"/><text x="680.0" y="365.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the registered name</text><text x="680.0" y="383.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">安心食品服務股份有限公司</text>
<path d="M274,368 L552,368" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a)"/><text x="413" y="360" text-anchor="middle" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the name on the register</text>
<path d="M680,200 L680,232" fill="none" stroke="#111111" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M680,300 L680,332" fill="none" stroke="#111111" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="690" y="222" text-anchor="start" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">none? falls to</text>
<text x="690" y="322" text-anchor="start" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">none? falls to</text>
<text x="20" y="480" text-anchor="start" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Why three rungs and not one</text>
<text x="32" y="504" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• A register knows 安心食品服務股份有限公司; a hungry person knows 摩斯漢堡</text>
<text x="32" y="524" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• No sign on file falls to the brand; no brand falls to the registered name</text>
<text x="32" y="544" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• A branch sign is the only name that tells two shops of one chain apart</text>
<text x="32" y="564" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• Every rung comes from a published source; no name here is written by us</text>
<text x="20" y="610" text-anchor="start" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">When two branches share one name</text>
<text x="32" y="634" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• Sign-less sites of one company get the district, road and section in brackets</text>
<text x="32" y="654" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• Same road, same section: then the house number, and only then</text>
</svg>