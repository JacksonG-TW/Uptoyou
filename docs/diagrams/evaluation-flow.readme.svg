<svg xmlns="http://www.w3.org/2000/svg" width="840" height="512" viewBox="0 0 840 512" font-family="Helvetica Neue, Helvetica, Arial, 'Noto Sans TC', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="840" height="512" fill="#ffffff"/>
<text x="20" y="34" text-anchor="start" font-size="20" font-weight="800" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Up to You — how a classifier candidate is scored</text>
<rect x="20" y="70" width="240" height="64" rx="8" fill="#F6F7F9" stroke="#111111" stroke-width="1.6"/><text x="140.0" y="99.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">testset_v3.json</text><text x="140.0" y="117.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">200 rows · 13 values · frozen</text>
<rect x="560" y="70" width="260" height="64" rx="8" fill="#F6F7F9" stroke="#111111" stroke-width="1.6"/><text x="690.0" y="99.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">four candidates</text><text x="690.0" y="117.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">gemma · llama · qwen · qwen7b</text>
<rect x="560" y="190" width="260" height="64" rx="8" fill="#F6F7F9" stroke="#111111" stroke-width="1.6"/><text x="690.0" y="219.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">round_&lt;name&gt;.json</text><text x="690.0" y="237.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">one per candidate</text>
<rect x="20" y="190" width="240" height="64" rx="8" fill="#F6F7F9" stroke="#111111" stroke-width="1.6"/><text x="140.0" y="219.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">score → report.md</text><text x="140.0" y="237.0" text-anchor="middle" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">per layer, per value</text>
<path d="M260,102 L556,102" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a)"/><text x="408" y="94" text-anchor="middle" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the same 200 rows</text>
<path d="M690,134 L690,186" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a)"/><text x="700" y="166" text-anchor="start" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">one round each</text>
<path d="M560,222 L264,222" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a)"/><text x="412" y="214" text-anchor="middle" font-size="13" font-weight="500" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">scored, never re-run</text>
<text x="20" y="300" text-anchor="start" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The v7 table, as measured</text>
<text x="32" y="324" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• qwen7b 72.0 · gemma2:2b 71.0 · llama3.2:3b 70.5 · qwen2.5:3b 65.5</text>
<text x="32" y="344" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• The 7B did not move while every small model gained 5–9: a 10.5-point gap became 1.0, inside the band</text>
<text x="20" y="390" text-anchor="start" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What makes two numbers comparable</text>
<text x="32" y="414" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• A round file names its own test set; read that field before comparing anything</text>
<text x="32" y="434" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• A prompt or label change makes every crib stale, and a round refuses a stale crib</text>
<text x="32" y="454" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• gemini is the hosted baseline: host-side only, and --rag is refused (the crib is the answer key)</text>
<text x="32" y="474" text-anchor="start" font-size="13" font-weight="400" fill="#5A5C63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">• The crib is example_embedding (pgvector, k=5, leave-one-out)</text>
</svg>