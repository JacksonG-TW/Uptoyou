# Security headers (owner 「A」, 2026-10-10), included at the server level AND in every location that
# sets its own `add_header`: nginx inherits server-level `add_header` lines only into a location that
# has none of its own, so a location with a Cache-Control would otherwise send none of these.
# `always` sends them on every status, errors included.
#
# **The full policy is enforced (owner 「A」, 2026-10-11).** It was Report-Only while every screen was
# walked with the browser's reports read (`probes/csp_walk.py`); the one source it ever caught, the old
# district picker's injected <style>, went with that picker, and the walk on this build reads zero. The
# clickjacking line that was enforced on its own is folded in: `frame-ancestors` is the last directive.
# Nothing collects reports: no `report-uri`, so no endpoint stores anything about a visitor, and a
# screen the walk missed shows up only in that visitor's own console.
# Sources: the bundle loads nothing from another origin (no CDN, fonts are self-hosted, the stream
# is same-origin). No `'unsafe-inline'` anywhere: React's `style={…}` writes through the CSSOM, which
# CSP does not police, so it needs none. `img-src data:` is for an SVG noise texture the front end's
# reveal work adds as a CSS background.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# OWASP's HTTP Headers Cheat Sheet (read 2026-10-10): «X-Content-Type-Options: nosniff».
add_header X-Content-Type-Options "nosniff" always;
# OWASP's value, «strict-origin-when-cross-origin»: another site learns only our origin, never a
# path or query (`/reveal?round=…`). The device key is in the fragment, which no Referer carries.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# One year, this host only. Served from uptoyou.jacksong-tw.com, the header binds that one name —
# never jacksong-tw.com itself, which a subdomain's header cannot reach. `includeSubDomains` would add
# only names UNDER this host, and the zone holds none (one A record, the owner's dashboard 2026-10-10),
# so it is left off: it would protect nothing and commit names that do not exist. No `preload`.
# Browsers ignore the header over plain HTTP, so a localhost clone is unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;
