# The only thing published to the host. The API and the database are reachable only over
# the compose network.

# Docker's embedded DNS. It is here because nginx resolves an upstream name **once, at
# startup**, and caches the address for the life of the process: recreate the api container
# and nginx keeps posting to an address nothing answers on, returning 502 while the API is
# perfectly healthy. It survives a `docker compose up` on a clean machine and breaks on every
# rebuild after it, which is the quiet-degradation shape H23 describes and H26 now records.
#
# `valid=10s` re-resolves on that interval. The other half of the fix is below: nginx only
# resolves at request time when the upstream is written as a *variable*, so every proxy_pass
# here goes through one, and there is deliberately no `upstream` block to fall back into.
resolver 127.0.0.11 valid=10s ipv6=off;

# **The client's address, restored — without this every visitor is Cloudflare.**
#
# `$binary_remote_addr` is the peer's address, and behind Cloudflare the peer is always an edge
# node. So the two `limit_*_zone` keys below would count every visitor arriving through one edge
# node as one address: `limit_conn streams 64` becomes a shared ceiling rather than a per-visitor
# one, and the first person to reach it locks out everyone behind that node. Measured on the
# shipped config, 2026-09-12: no `real_ip_header`, no `set_real_ip_from`, and `X-Forwarded-For` set
# but never read back.
#
# **`set_real_ip_from` is not optional decoration — it is the whole of the trust.** Cloudflare:
# «This header will only be sent on the traffic from Cloudflare's edge to your origin web server»
# (developers.cloudflare.com/fundamentals/reference/http-headers/, read 2026-09-12). So the header
# is absent on any request that did not come through Cloudflare — and a request that reaches the
# origin directly can *send* one. Without the trusted-source list nginx would believe it, and any
# caller could assert any address it liked, which is a worse position than the one this fixes.
#
# The fifteen published IPv4 ranges, from cloudflare.com/ips-v4, read 2026-09-12.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare: «CF-Connecting-IP provides the client IP address connecting to Cloudflare to the
# origin web server» (same page, same date). One address, not a list.
real_ip_header CF-Connecting-IP;

# **`real_ip_recursive` is deliberately left at its default (off), and that is a decision.** It
# governs how nginx walks a header holding SEVERAL addresses — the `X-Forwarded-For` case. This
# header holds exactly one, so recursion has nothing to walk and turning it on would be a setting
# that looks considered and does nothing. If this ever moves to `X-Forwarded-For`, it becomes
# load-bearing and must be revisited in the same commit.

# **IPv6 is not listed because it cannot arrive.** Measured on the box 2026-09-12: no global IPv6
# address, the proxy listens on 0.0.0.0 only, and the security group admits 443 from Cloudflare's
# fifteen IPv4 ranges alone. So a v6 request from Cloudflare never reaches this origin, and the v6
# list would be fifteen more lines that can never match. **If a v6 address is ever added to the
# box, the v6 list goes here in the same change** — otherwise those visitors keep the edge address
# and both rate limits go back to being shared for them, silently.
#
# **The list goes stale silently, and there is now an instrument for it rather than a warning.**
# These are what Cloudflare published on 2026-09-12; ranges change rarely and without notice, and
# one added after this commit gives those visitors the edge address with no symptom at all.
# `python3 probes/cf_ranges_check.py` fetches `cloudflare.com/ips-v4` and diffs it against the
# `set_real_ip_from` lines here, exiting 1 on any difference — **run it before naming any proxy
# candidate**, which is what the Probes table says. The date above stays so a reader knows how old
# the list is without running anything.

# **Rate limiting, added 2026-09-04 for launch. The numbers are measured, not chosen.**
#
# **The unit is one ADDRESS, and one address is a whole room.** Five friends deciding where to
# eat are on one wifi behind one NAT, so they reach this proxy as a single `$binary_remote_addr`.
# A per-address limit tuned for "one phone" locks the product's entire use case out of itself.
# The evaluator's five-friend walkthrough (A5) drives five browsers from one host for the same
# reason, so it is both the gate and a fair model of a room.
#
# Measured on this proxy's own log, 2,728 requests: the busiest single second is **31 requests**,
# all from one address. `rate=30r/s` with `burst=60 nodelay` therefore lets that second through
# whole and sustains it, while a careless loop — which does hundreds a second, not thirty — is
# refused. **If A5 ever trips this, the limit is wrong and not the walkthrough.**
limit_req_zone $binary_remote_addr zone=api:1m rate=30r/s;

# The stream is one long-lived connection per phone, so this is counted rather than rated.
#
# **64, and the number is set by the LOAD LADDER, not by the product's expected load — do not
# "tighten" it to a plausible-looking 10 without reading this.** `g_ladder.py`'s LD-B is ten
# circles × five seats = **50 live streams, all from one host and therefore one address**. It is
# a standing gate and the owner's own measurement; a limit that refuses 40 of its 50 measures the
# limit rather than the product. 64 leaves headroom above it and still refuses an address opening
# hundreds.
#
# **This number used to rest on a second premise, and that premise is now gone — amended
# 2026-09-04 rather than left standing.** It read: nothing here can tell a dead client from a
# quiet one, so the limit must carry slack for slots held up to `proxy_read_timeout` (1 h) by
# phones that dropped off wifi without closing their connection. **`live.py` now sends `: ping`
# every 25 s**, so a dead peer's next write fails and its slot frees within about that — the slack
# is no longer needed and the argument no longer applies.
#
# **64 does not move, and it is a tighter number for it: it stands on the ladder alone.** Real use
# behind one NAT is five or six phones, a spare tab each and a reconnect in flight — call it 15.
# The ladder needs 50. A stream a member left open in a pocket is a *live* connection and should
# hold a slot; that is the limit working, not slack.
#
# **The comment is amended rather than deleted because a number justified by a premise that has
# quietly stopped being true is how the number gets argued away later** — and the person doing the
# arguing would be right about the premise and wrong about the number.
limit_conn_zone $binary_remote_addr zone=streams:1m;

# 429, not 503: a limited client and a broken server are different facts, and the surface can
# only tell them apart if the status does.
limit_req_status 429;
limit_conn_status 429;

server {
    # Nothing is served by knowing the version. Off before launch rather than after.
    server_tokens off;

    # This API takes small JSON — a proposal, a preference, a token. Nothing legitimate is
    # anywhere near this, and the ceiling costs a rejected upload rather than a filled disk on a
    # box with ~180 MB of margin.
    client_max_body_size 32k;

    # **8080, not 80, and the reason is the image rather than a preference.** A11 (5) moved this
    # image to `nginxinc/nginx-unprivileged`, whose master process runs as uid 101, and a non-root
    # process cannot bind a port below 1024. On 80 the container does not fail to *serve* — it
    # fails to *start*, before it can log anything that names the port as the cause.
    #
    # **The published port is unchanged.** `compose.yaml` maps `${UPTO_HTTP_PORT:-8080}` to 8080
    # instead of to 80, so `localhost:8080` is still `localhost:8080` and `UPTO_HTTP_PORT` still
    # means what it meant. Nothing outside this container sees the move.
    #
    # **Rejected: `sysctls: net.ipv4.ip_unprivileged_port_start=0` to keep `listen 80`.** It works
    # and touches nothing here, and it re-opens every low port to every process in the container —
    # giving back part of what running as a non-root user was bought for.
    listen 8080;
    # **TLS is a mounted file, not a build (candidate 12, owner-ruled 2026-09-05).** The proxy image
    # is the same everywhere; a host that terminates TLS drops `listen 8443 ssl;` and its two
    # `ssl_certificate*` lines into `tls/` beside compose.yaml, which compose mounts here read-only.
    # A glob that matches nothing is not an error, so a dev VM and CI — whose `tls/` holds only
    # `.gitkeep` — run this exact block unchanged (D112: the absence has a shape, an empty dir).
    # Rejected: a second server block or a second nginx in front — both duplicate the SSE settings
    # below, and the second collapses `limit_conn` onto one loopback address.
    include /etc/nginx/tls/*.conf;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A variable, not a literal — see the resolver note above.
    set $api_backend "api:8000";

    # **D104 (2026-08-18) replaced D3's no-build Vue global with a Vite + React bundle**, so
    # this is no longer a directory of plain files: everything but `index.html` arrives under
    # `assets/` already fingerprinted by the build, and `fonts/` and `img/` arrive verbatim
    # from `web/public/` (Vite copies `publicDir` without hashing — which is what keeps
    # `font_subset_check --shipped` pointed at a fixed filename). The fallback below is
    # unchanged by that: a client-routed path still has to reach `index.html`.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # **`index.html` must never be held, and it is the ONE file here that must not be.** It is
    # the only unhashed name in the bundle: it is what points at `assets/index-<hash>.js`, so a
    # client holding yesterday's copy asks for yesterday's hash, which the new image does not
    # contain — a blank surface with a 404 in the console and a green deploy. `no-cache` does
    # not mean *do not store*; it means *revalidate before use*, so the usual answer is a 304
    # against the ETag nginx already sends and the file is re-downloaded only when it changed.
    # **The `=` is load-bearing:** `try_files` above ends in an internal redirect to
    # `/index.html`, and an internal redirect re-runs location matching — so this one block
    # covers a direct hit, a bare `/`, and every client-routed path that falls back.
    # **Rejected: `no-store`** — it also forbids the 304, so every navigation re-downloads the
    # document for no gain, and the dead-venue-wifi case (§6) is the one where that hurts.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # **The content-hashed bundle, and the only thing here that may be cached hard.** Vite
    # fingerprints everything it emits into `assets/` (`index-BJXrQBfJ.css`,
    # `index-CuLGAf2c.js`), so the file at a given name can never change: a new build is a new
    # name, and `immutable` tells the client it need not even revalidate. This replaces the
    # `/vendor/` block D3 left behind (deleted 2026-09-11): nothing has been served from
    # `/vendor/` since D104, and the *intent* — cache the long-lived asset hard — never
    # followed the files when they moved, so the bundle was being re-fetched on every visit.
    #
    # **One header line, not `expires` plus `add_header`.** `expires` emits its own
    # `Cache-Control: max-age=…`, so the old pair sent the header TWICE; one explicit line is
    # the same instruction said once. `always` so it is set on a 304 as well as a 200.
    #
    # **`fonts/` and `img/` are deliberately NOT here, and must not be added.** Vite copies
    # `web/public/` verbatim, so those names are FIXED — `/fonts/*.woff2` is fixed on purpose,
    # which is what lets `font_subset_check --shipped` name a file rather than chase a hash.
    # A fixed name marked `immutable` is a cache that can never be corrected: re-subset the
    # face and a returning visitor keeps the old one until the browser evicts it.
    # **No `always` on this one, and that is the whole of it (2026-09-11, reviewer's catch).**
    # `always` sets the header on EVERY status, a 404 included — and a 404 carrying a year of
    # `immutable` is a negative cache a client may hold for a year, under the one path that
    # serves the app's only JavaScript. The way it gets asked for is the case the `index.html`
    # rule above exists for: a client holding a document fetched seconds before a deploy asks
    # for an asset hash the new image does not contain. Without `always`, nginx still sets the
    # header on the success and redirect set — **304 included, which is the one that mattered
    # here** (measured, not assumed) — and the 404 goes out with no freshness at all.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # **The verbatim half of the bundle: a day, then ask again — and never `immutable`.**
    # Vite copies `web/public/` through without hashing or rewriting, so these names are FIXED
    # (`/fonts/*.woff2` on purpose — it is what lets `font_subset_check --shipped` name a file
    # instead of chasing a hash in Vite's manifest). A fixed name is the opposite of the
    # `assets/` case above: the file at a given name CAN change, so the cache has to be able
    # to notice. `must-revalidate` is the half that matters — after the day is up the client
    # must ask, and may not serve a stale copy while it does.
    #
    # **The trade, stated because it is a real one (orchestrator, 2026-09-11):** the font pair
    # is ~1.1 MB and was being re-fetched on every visit; a day of cache buys that back and
    # costs up to a day of a stale face after a re-subset. **Rejected: `immutable`** — the
    # bytes are the same and the staleness becomes unbounded, a cache nobody can correct.
    # **Rejected: no rule at all** (the state before this line) — 1.1 MB every visit, on the
    # dead-venue-wifi case §6 grades.
    # No `always` here either, for the reason spelled out under `/assets/`. The stake is
    # smaller — a day of a negatively-cached miss rather than a year — but `always` was buying
    # nothing: the 304 these need is already in the set nginx adds to without it.
    location /fonts/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location /img/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Server-sent events (D8), and this block comes first because nginx matches the longest
    # prefix. Buffering here is H13: the proxy holds each event until its buffer fills, so
    # the stream arrives in bursts or not at all and the product's live moment silently stops
    # being live. These lines are the mitigation, in place before the first stream exists
    # rather than after it is debugged.
    location ~ ^/api/circles/[0-9]+/stream$ {
        # Counted, never rated: one stream is one request that lasts an hour, so `limit_req`
        # here would refuse the second phone in the room rather than the hundredth. The 64 is the
        # load ladder's 50 plus headroom — see the zone above for why it is not 10.
        limit_conn streams 64;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;

        # With a variable upstream, nginx does not strip the location prefix by itself the
        # way `proxy_pass http://api/;` used to — so the rewrite does it explicitly.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://$api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
